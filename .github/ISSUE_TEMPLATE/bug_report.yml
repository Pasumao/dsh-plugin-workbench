name: Bug 报告
description: 提交一个问题，帮助我们改进
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug！请尽量提供完整信息，方便复现与排查。
  - type: input
    id: version
    attributes:
      label: 插件版本
      description: package.json 中的 version，或 git commit
      placeholder: "0.0.1"
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 例如 `npm ls @deepseek-ai/dsh` 的输出
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何触发这个问题？
      placeholder: |
        1. 打开 dsh web
        2. 点击 …
        3. 观察到 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 包括报错信息、浏览器控制台输出、RPC 响应等
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 操作系统、浏览器、Node/pnpm 版本
